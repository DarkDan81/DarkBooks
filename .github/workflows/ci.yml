name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
  portable:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - run: python scripts/build_portable.py
      - name: Test bundled workers
        shell: pwsh
        run: |
          $build = Get-Content dist/portable-build.json -Raw | ConvertFrom-Json
          $env:BOOK_TEST_PORTABLE_ROOT = $build.staging
          python -m unittest discover -s tests -p test_webapp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: DarkBooks-Windows-x64
          path: dist/DarkBooks-Windows-x64.zip
          if-no-files-found: error
